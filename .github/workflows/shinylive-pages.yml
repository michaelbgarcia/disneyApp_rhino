name: Deploy Shinylive to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'shinylive/**'
      - 'scripts/build_shinylive_snapshot.R'
      - '.github/workflows/shinylive-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'

      - name: Install required R packages
        shell: Rscript {0}
        run: |
          install.packages(c('shiny', 'bslib', 'dplyr', 'ggplot2', 'shinylive'))

      - name: Export Shinylive bundle
        shell: Rscript {0}
        run: shinylive::export(appdir = 'shinylive', destdir = 'site')

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
